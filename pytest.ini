# pytest.ini — Configurazione Test Suite Tool Manager V14
# Posizionato nella root del progetto

[pytest]

# ── Cartella test ────────────────────────────────────────────
testpaths = tests

# ── Pattern file di test ─────────────────────────────────────
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output verboso di default ────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# ── Marker custom ────────────────────────────────────────────
# Usali per raggruppare test lenti o di integrazione:
#   @pytest.mark.slow
#   @pytest.mark.integration
markers =
    slow: test lenti o che richiedono risorse esterne
    integration: test di integrazione end-to-end
    smoke: test di fumo veloci (subset minimo)

# ── Coverage (opzionale, attivato con --cov) ─────────────────
# Esegui con: pytest --cov=logic --cov=database --cov=utils

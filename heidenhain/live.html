<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{NOME}} — Live</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    header { display: flex; gap: 1rem; align-items: center; padding: .5rem .8rem; background: #1c1c1c; border-bottom: 1px solid #333; }
    header h1 { font-size: .95rem; margin: 0; font-weight: 600; }
    .back { color: #58a6ff; text-decoration: none; font-size: 1.1rem; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; background: #666; display: inline-block; }
    .dot.ok { background: #3fb950; } .dot.ko { background: #f85149; }
    .muted { font-size: .8rem; opacity: .65; }
    label { font-size: .82rem; }
    #screen { width: 100%; height: calc(100vh - 48px); }
    #ctrl:checked ~ span { color: #f0a020; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="/">&larr;</a>
    <span id="dot" class="dot"></span>
    <h1>{{NOME}} <span class="muted">{{IP}}</span></h1>
    <label><input type="checkbox" id="ctrl" /> abilita comando (mouse/tastiera)</label>
    <span id="status" class="muted">connessione…</span>
  </header>
  <div id="screen"></div>

  <script type="module">
    import RFB from '/novnc/core/rfb.js';
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/m/{{MID}}/vnc`;
    const dot = document.getElementById('dot');
    const st = document.getElementById('status');

    const rfb = new RFB(document.getElementById('screen'), url);
    rfb.viewOnly = true;          // DEFAULT: sola visione, nessun comando alla macchina
    rfb.scaleViewport = true;     // adatta lo schermo alla finestra
    rfb.resizeSession = false;

    rfb.addEventListener('connect', () => { dot.className = 'dot ok'; st.textContent = 'sola visione'; });
    rfb.addEventListener('disconnect', () => { dot.className = 'dot ko'; st.textContent = 'disconnesso'; });

    document.getElementById('ctrl').addEventListener('change', (e) => {
      rfb.viewOnly = !e.target.checked;
      st.textContent = e.target.checked ? '⚠ CONTROLLO ATTIVO' : 'sola visione';
    });
  </script>
</body>
</html>

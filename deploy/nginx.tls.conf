# DMG Desk — nginx con TLS (variante di nginx.conf per il deploy Docker)
# =======================================================================
# Montare cert.pem/key.pem nel container (o path host) e attivare DMG_TRUST_PROXY=1
# sul backend così il rate-limit vede il vero IP client (non quello del proxy).
# Genera i cert con:  py scripts/genera_cert_tls.py

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket relay VNC (/api/schermo/vnc) — richiede Upgrade/Connection
    location /api/schermo/vnc {
        proxy_pass         http://backend:8000/api/schermo/vnc;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Proxy API → backend FastAPI
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }

    location ~ ^/(health|docs|redoc|openapi.json) {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

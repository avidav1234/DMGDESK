<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{NOME}} — Live TNC 640</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    header { display: flex; gap: 1rem; align-items: center; padding: .5rem .8rem; background: #1c1c1c; border-bottom: 1px solid #333; }
    header h1 { font-size: .95rem; margin: 0; font-weight: 600; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; background: #666; display: inline-block; }
    .dot.ok { background: #3fb950; } .dot.ko { background: #f85149; }
    label { font-size: .8rem; opacity: .8; }
    input[type=range] { vertical-align: middle; }
    main { display: flex; justify-content: center; padding: .6rem; }
    img { max-width: 100%; height: auto; border: 1px solid #333; background: #000; image-rendering: auto; }
    .muted { font-size: .75rem; opacity: .6; }
  </style>
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <a href="/" style="color:#58a6ff;text-decoration:none">&larr;</a>
    <h1>{{NOME}} &middot; {{IP}}</h1>
    <label>refresh <span id="ms">700</span> ms
      <input id="rate" type="range" min="300" max="3000" step="100" value="700" />
    </label>
    <label><input id="run" type="checkbox" checked /> live</label>
    <span class="muted">solo visione (nessun comando inviato)</span>
  </header>
  <main>
    <img id="screen" alt="schermo TNC 640" />
  </main>

  <script>
    const img = document.getElementById('screen');
    const dot = document.getElementById('dot');
    const rate = document.getElementById('rate');
    const msLbl = document.getElementById('ms');
    const runChk = document.getElementById('run');
    let timer = null;

    function tick() {
      const next = new Image();
      next.onload = () => { img.src = next.src; dot.className = 'dot ok'; };
      next.onerror = () => { dot.className = 'dot ko'; };
      next.src = '/m/{{MID}}/screenshot.png?t=' + Date.now();  // cache-busting
    }
    function schedule() {
      if (timer) clearInterval(timer);
      if (runChk.checked) timer = setInterval(tick, parseInt(rate.value, 10));
    }
    rate.addEventListener('input', () => { msLbl.textContent = rate.value; schedule(); });
    runChk.addEventListener('change', schedule);
    tick(); schedule();
  </script>
</body>
</html>
